name: Release Docker Images

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: "是否登录 registry 并推送镜像；在 fork 中无凭据时可关闭"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-docker-images-${{ github.ref }}
  cancel-in-progress: false

env:
  # 华为云 SWR 镜像仓库。
  IMAGE_REPOSITORY: swr.cn-north-4.myhuaweicloud.com/opentile/triton
  # Quay.io 只发布 9 个多架构标准 tag。
  QUAY_REGISTRY: quay.io
  QUAY_IMAGE_REPOSITORY: quay.io/ascend/triton

  TRITON_ASCEND_VERSION: "3.6.0"
  CANN_VERSION: "9.2.0"
  TORCH_NPU_VERSION: "2.10.0.post7"
  PYTHON_SERIES: "3.11"

jobs:
  retag:
    name: Retag ${{ matrix.device_type }}-${{ matrix.os.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        device_type: ["910b", "950", "a3"]
        os:
          - name: debian12
          - name: ubuntu24.04
          - name: openeuler24.03

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Huawei Cloud SWR
        if: ${{ inputs.push_images }}
        uses: huaweicloud/swr-login@v2.1.0
        with:
          region: cn-north-4
          access-key-id: ${{ secrets.HUAWEI_CLOUD_AK }}
          access-key-secret: ${{ secrets.HUAWEI_CLOUD_SK }}

      - name: Log in to Quay.io
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Generate image tag
        id: tags
        run: |
          set -euo pipefail
          base_tag="${TRITON_ASCEND_VERSION}-cann${CANN_VERSION}-torch_npu${TORCH_NPU_VERSION}-${{ matrix.device_type }}-${{ matrix.os.name }}-py${PYTHON_SERIES}"
          echo "base_tag=${base_tag}" >> "${GITHUB_OUTPUT}"
          echo "source_image=${IMAGE_REPOSITORY}:${base_tag}" >> "${GITHUB_OUTPUT}"
          echo "quay_image=${QUAY_IMAGE_REPOSITORY}:${base_tag}" >> "${GITHUB_OUTPUT}"
          echo "Source image: ${IMAGE_REPOSITORY}:${base_tag}"
          echo "Quay image:   ${QUAY_IMAGE_REPOSITORY}:${base_tag}"

      - name: Verify source multi-architecture image
        env:
          SOURCE_IMAGE: ${{ steps.tags.outputs.source_image }}
        run: |
          set -euo pipefail

          manifest="$(docker buildx imagetools inspect "${SOURCE_IMAGE}")"
          grep -q "linux/amd64" <<<"${manifest}"
          grep -q "linux/arm64" <<<"${manifest}"
          echo "Verified source image: ${SOURCE_IMAGE}"

      - name: Copy image to Quay.io
        if: ${{ inputs.push_images }}
        env:
          SOURCE_IMAGE: ${{ steps.tags.outputs.source_image }}
          DESTINATION_IMAGE: ${{ steps.tags.outputs.quay_image }}
        run: |
          set -euo pipefail
          # 直接复制多架构 manifest 和 blobs，等价于 pull、retag、push。
          docker buildx imagetools create \
            --tag "${DESTINATION_IMAGE}" \
            "${SOURCE_IMAGE}"

      - name: Verify Quay.io multi-architecture image
        if: ${{ inputs.push_images }}
        env:
          DESTINATION_IMAGE: ${{ steps.tags.outputs.quay_image }}
        run: |
          set -euo pipefail
          quay_manifest="$(docker buildx imagetools inspect "${DESTINATION_IMAGE}")"
          grep -q "linux/amd64" <<<"${quay_manifest}"
          grep -q "linux/arm64" <<<"${quay_manifest}"
          echo "Verified Quay image: ${DESTINATION_IMAGE}"
